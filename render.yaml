services:
  - type: web
    name: viva-banking
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: ./start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
